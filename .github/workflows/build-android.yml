name: Build Android APK

# 触发条件：android/ 目录有改动，或手动点 Run workflow
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

# 允许把 APK 自动发布成 Release（GITHUB_TOKEN 默认只读，这里要放开写权限）
permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 第一关：核心逻辑测试（约 30 秒）
  # ---------------------------------------------------------------------------
  # 放最前面是因为安卓构建要 20-40 分钟。如果核心逻辑有问题，
  # 应该在这里 30 秒内就失败，而不是让人等半小时才发现。
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 运行核心逻辑验证
        run: python android/test_core.py

  # ---------------------------------------------------------------------------
  # 第二关：打包 APK
  # ---------------------------------------------------------------------------
  build:
    needs: test-core
    # 必须用 22.04：buildozer / python-for-android 在 24.04 上是坏的
    # （libtinfo5 被移除，且编译 python recipe 时会撞 glibc 报错）。
    # 22.04 是官方安装文档验证过的版本。
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: ./android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev

      - name: 缓存 buildozer（SDK / NDK / 已编译 recipe）
        # 首次构建会下载约 2-5GB 的 Android SDK 与 NDK。缓存后后续构建
        # 能省掉这一步。GitHub 单仓库缓存上限 10GB，超了会自动跳过。
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            android/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('android/buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: 安装 buildozer
        # 版本全部锁死。buildozer 1.6.0 要求 cython<3.0；
        # p4a 锁正式版而不是 master，否则会拉到没验证过的 CPython/NDK 组合。
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.6.0 "cython<3.0" python-for-android==2026.5.9

      - name: 构建 APK（首次约 20-40 分钟）
        # yes | 是为了自动接受 Android SDK 许可证，否则会卡在交互提示上直到超时。
        # 关掉 pipefail：yes 被 SIGPIPE 结束会返回 141，否则会让整步误判为失败。
        run: |
          set +o pipefail
          yes 2>/dev/null | buildozer -v android debug

      - name: 上传 APK（构建产物，90 天后过期）
        uses: actions/upload-artifact@v4
        with:
          name: diskscanner-debug
          path: android/bin/*.apk
          retention-days: 90
          if-no-files-found: error

      - name: 发布 Release（APK 长期保留）
        # 构建产物有 90 天有效期，Release 里的附件不会过期，
        # 所以 APK 同时发一份到 Release，方便长期下载。
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v0.1.0-${{ github.run_number }}
          name: Android APK v0.1.0 (#${{ github.run_number }})
          body: |
            安卓版存储扫描 APK，由 GitHub Actions 自动构建。

            - 核心逻辑复用 Windows 版（corescan.py，程序化抽取未改写）
            - 需要 Android 7.0+，安装后首次打开要到系统设置开启「所有文件访问」
            - 扫码范围仅限共享存储，各 App 私有数据受系统限制无法枚举

            artifact 里的同名 APK 90 天后过期，本 Release 附件长期有效。
          files: android/bin/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建日志（失败时便于定位）
        if: failure()
        run: |
          echo "===== buildozer 日志末尾 ====="
          tail -n 200 .buildozer/logs/*.log 2>/dev/null || true
          echo "===== 已安装的 SDK 平台 ====="
          ls ~/.buildozer/android/platform/android-sdk/platforms 2>/dev/null || true
          echo "===== 已安装的 NDK ====="
          ls ~/.buildozer/android/platform/android-sdk/ndk 2>/dev/null || true
